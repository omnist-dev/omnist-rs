[package]
name = "omnist"
version = "0.1.3-alpha"
edition = "2024"
description = "One data model, many formats: read, validate, and write JSON, YAML, TOML, XML, and OML. (Rust port of https://github.com/omnist-dev/omnist)"
license = "Apache-2.0"
repository = "https://github.com/omnist-dev/omnist-rs"
publish = false

[dependencies]
indexmap = "2"
thiserror = "2"
regex = "1"
yaml-rust2 = { version = "0.11.0", default-features = false }
toml_edit = { version = "0.25.13", default-features = false, features = ["parse", "display"] }
quick-xml = "0.41.0"
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
proptest = "1"
# Fixture-corpus replay only (issue #40): the harness reads a JSON corpus
# extracted from the live Python test suite. Not used by any non-test code.
serde_json = "1"

[[bench]]
name = "yaml_merge"
harness = false
